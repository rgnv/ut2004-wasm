<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UT2004 — browser client</title>
<link rel="icon" href="data:,">
<link rel="preload" href="ut2004.wasm?v=phase13c-menu" as="fetch" crossorigin>
<link rel="stylesheet" href="../assets/mobile-input.css?v=mobile1">
<script src="../assets/mobile-input.js?v=mobile1"></script>
<style>
body { margin: 12px; background: #171b22; color: #ddd; font: 16px monospace }
form, .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
input { max-width: 100%; box-sizing: border-box }
#viewport { width: 100%; background: #000; line-height: 0 }
canvas { display: block; width: 100%; max-width: 100%; height: auto; outline: 1px solid #888 }
#viewport:fullscreen { display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh }
#viewport:fullscreen canvas { width: min(100vw, calc(100vh * var(--aspect))); height: auto; max-height: 100vh; outline: none }
pre { white-space: pre-wrap; max-height: 240px; overflow: auto }
</style>
<h1>UT2004 — browser client</h1>
<form method="get"><label>Player name <input name="name" id="name" maxlength="20" value="WasmPlayer"></label><input type="hidden" name="interactive" value="1"><input type="hidden" name="connect" value="1"><button type="submit">Join multiplayer</button></form>
<p id="status">Loading browser client…</p>
<p class="controls"><label>Resolution <select id="resolution" aria-label="Internal resolution">
<option value="640x480">640×480</option><option value="960x540">960×540</option><option value="1280x720" selected>1280×720</option>
<option value="dynamic">Dynamic (match window)</option><option value="custom">Custom…</option>
</select></label><span id="custom-resolution" hidden>
<label>Width <input id="resolution-width" type="number" min="320" max="3840" step="2" value="1280"></label>
<label>Height <input id="resolution-height" type="number" min="240" max="2160" step="2" value="720"></label></span>
<button id="apply-resolution" type="button">Apply</button><button id="reload-resolution" type="button">Apply and reload</button>
<button id="fullscreen" type="button">Fullscreen</button><span id="display-status" role="status"></span></p>
<p class="controls"><label>Local map <select id="map" aria-label="Local map" disabled></select></label><button id="play-map" type="button" disabled>Play locally vs bots</button></p>
<div id="viewport"><canvas tabindex="0" id="canvas" width="1280" height="720" aria-label="UT2004 engine viewport"></canvas></div>
<p id="input-help">Click viewport to focus. WASD moves, mouse looks, Tab opens console. Escape closes menu; click to spawn. F1 shows scoreboard.</p>
<p><a href="?interactive=1&map=DM-Rankin">Play DM-Rankin</a> · <a href="?interactive=1&splash=1">Splash timing probe</a> · <a href="?bounded=1">Bounded CI run</a> <button id="stop" type="button">Stop client</button></p>
<pre id="log"></pre>
<script>
window.bootResult = null;
function result(data) {
  window.mobileInput?.destroy();
  if (window.lastFramePNG) {
    const image = new Image();
    image.src = window.lastFramePNG;
    image.alt = 'Last engine framebuffer, captured before SDL teardown';
    Module.canvas.replaceWith(image);
  }
  window.bootResult = data;
  document.getElementById('status').textContent = JSON.stringify(data);
  console.log('WASM browser status: ' + JSON.stringify(data));
}
const options = new URLSearchParams(location.search);
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const resolution = document.getElementById('resolution');
let savedResolution;
try { savedResolution = localStorage.getItem('ut2004-resolution'); } catch (_) {}
const validResolution = value => {
  const match = /^(\d{3,4})x(\d{3,4})$/.exec(value || '');
  return match && +match[1] >= 320 && +match[1] <= 3840 && +match[2] >= 240 && +match[2] <= 2160 && +match[1] % 2 === 0 && +match[2] % 2 === 0;
};
const snap = (value, min, max) => Math.max(min, Math.min(max, Math.round(value / 2) * 2));
// Match viewport CSS pixels, independently capped per axis at the rendering budget.
const dynamicSize = () => [snap(Math.round(innerWidth * devicePixelRatio), 320, 2560),
  snap(Math.round(innerHeight * devicePixelRatio), 240, 1440)];
let activeResolution = [options.get('res'), savedResolution, '1280x720'].find(value => value === 'dynamic' || validResolution(value));
const widthInput = document.getElementById('resolution-width');
const heightInput = document.getElementById('resolution-height');
function showResolution(value, width, height) {
  resolution.value = value === 'dynamic' ? 'dynamic' : [...resolution.options].some(o => o.value === value) ? value : 'custom';
  widthInput.value = width; heightInput.value = height;
  document.getElementById('custom-resolution').hidden = resolution.value !== 'custom';
  resolution.querySelector('[value="dynamic"]').textContent = value === 'dynamic' ? `Dynamic — ${width}×${height}` : 'Dynamic (match window)';
  viewport.style.setProperty('--aspect', width / height);
}
const initialSize = activeResolution === 'dynamic' ? dynamicSize() : activeResolution.split('x').map(Number);
[canvas.width, canvas.height] = initialSize;
showResolution(activeResolution, ...initialSize);
resolution.onchange = () => { document.getElementById('custom-resolution').hidden = resolution.value !== 'custom'; };
function chosenResolution() {
  if (resolution.value !== 'custom') return resolution.value;
  if (!widthInput.value || !heightInput.value || !Number.isFinite(+widthInput.value) || !Number.isFinite(+heightInput.value)) {
    displayStatus.textContent = 'Enter a width and height.';
    return null;
  }
  widthInput.value = snap(+widthInput.value, 320, 3840);
  heightInput.value = snap(+heightInput.value, 240, 2160);
  return widthInput.value + 'x' + heightInput.value;
}
function reloadResolution(value) {
  try { localStorage.setItem('ut2004-resolution', value); } catch (_) {}
  const url = new URL(location.href);
  url.searchParams.set('res', value);
  location.assign(url);
}
let pendingResolution, resolutionTimer;
function applyResolution(value) {
  if (!value) return;
  activeResolution = value;
  const [width, height] = value === 'dynamic' ? dynamicSize() : value.split('x').map(Number);
  try { localStorage.setItem('ut2004-resolution', value); } catch (_) {}
  showResolution(value, width, height);
  if (canvas.width === width && canvas.height === height && !pendingResolution) return;
  if (!Module.interactiveReady) return; // Startup config uses the initial size; RAF readiness retries dynamic mode.
  pendingResolution = {value, width, height};
  clearTimeout(resolutionTimer);
  try {
    if (!Module._ut2004_request_resolution(width, height)) throw Error('resolution request rejected');
    resolutionTimer = setTimeout(() => reloadResolution(activeResolution), 5000);
  } catch (error) {
    console.warn('Live resolution failed; reloading: ' + error);
    reloadResolution(value);
  }
}
document.getElementById('apply-resolution').onclick = () => applyResolution(chosenResolution());
document.getElementById('reload-resolution').onclick = () => { const value = chosenResolution(); if (value) reloadResolution(value); };
let resizeTimer;
function scheduleResolution() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (activeResolution === 'dynamic') applyResolution('dynamic'); }, 250);
}
for (const event of ['resize', 'orientationchange', 'fullscreenchange'])
  window.addEventListener(event, scheduleResolution);
const fullscreenButton = document.getElementById('fullscreen');
const displayStatus = document.getElementById('display-status');
async function enterFullscreen() {
  try {
    await viewport.requestFullscreen();
    displayStatus.textContent = '';
  } catch (_) {
    displayStatus.textContent = 'Click Fullscreen or the viewport to enter fullscreen.';
  }
}
fullscreenButton.onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else enterFullscreen();
};
document.addEventListener('fullscreenchange', () => {
  fullscreenButton.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
  canvas.focus();
});
if (options.get('fullscreen') === '1') {
  enterFullscreen();
  canvas.addEventListener('click', () => {
    if (!document.fullscreenElement) enterFullscreen();
  }, {once: true});
}
const defaultJoin = !['interactive', 'bounded', 'splash', 'map'].some(key => options.has(key));
document.getElementById('name').value = options.get('name') || 'WasmPlayer';
window.__shutdown = () => { Module.shutdownRequested = true; };
document.getElementById('stop').onclick = window.__shutdown;
let audioGestureSeen = false;
function updateAudioStatus() {
  if (Module.audioDebug && Module.audioContext) Module.audioDebug.contextState = Module.audioContext.state;
  if (window.bootResult || !Module.interactive || Module.frameCount < 1) return;
  const base = Module.splash ? 'Playing splash' : 'Playing ' + Module.map;
  document.getElementById('status').textContent = !Module.noSound && Module.audioContext && Module.audioContext.state !== 'running'
    ? base + ' — Click to enable sound' : base;
}
const audioWait = ms => new Promise(resolve => setTimeout(resolve, ms));
async function unlockAudio() {
  audioGestureSeen = true;
  const contexts = [Module.SDL3?.audioContext, Module.audioContext].filter(Boolean);
  // Chrome latches a gesture's transient activation only after the pointerdown/
  // keydown dispatch has returned, and a resume() issued before that is left
  // pending forever rather than rejected. So each attempt is raced against a
  // short timeout and retried on a later task, inside the same activation window.
  for (const delayMs of [0, 0, 100, 200, 400, 800]) {
    if (delayMs) await audioWait(delayMs);
    await Promise.all(contexts.map(async ctx => {
      if (ctx.state !== 'suspended') return;
      try { await Promise.race([ctx.resume().catch(() => {}), audioWait(250)]); } catch (_) {}
      updateAudioStatus();
    }));
    if (contexts.every(ctx => ctx.state !== 'suspended')) break;
  }
  updateAudioStatus();
}
var Module = {
  interactive: defaultJoin || options.has('interactive') || options.has('map'),
  splash: options.has('splash'),
  connect: defaultJoin || options.has('connect'),
  noSound: options.get('nosound') === '1',
  dataBaseURL: location.pathname.startsWith('/ut2004/') ? '/ut2004/data/' : '/data3369/UT2004/',
  playerName: options.get('name') || 'WasmPlayer',
  relayURL: options.get('ws_url') || 'wss://games.rgnv.dev/ut2004b/connect2',
  locateFile: (path, prefix) => prefix + path + (path.endsWith('.wasm') ? '?v=phase13c-menu' : ''),
  debugInput: options.get('debug') === '1',
  audioDebug: options.get('debug') === '0' ? null : {
    deviceOpen: false, contextState: 'closed', musicPlaying: false,
    queued: 0, processed: 0, soundsStarted: 0, lastError: 0, rms: 0, peakRms: 0
  },
  onAudioContextCreated(ctx) {
    ctx.addEventListener?.('statechange', updateAudioStatus);
    // The browser's own autoplay gate already leaves a context created without a
    // gesture suspended; do not force a suspension of our own, because Chrome
    // then ignores the first resume() issued from that first gesture. Only catch
    // up when the player tapped before the engine finished starting.
    if (audioGestureSeen && ctx.state === 'suspended') {
      try { Promise.resolve(ctx.resume()).then(updateAudioStatus, updateAudioStatus); } catch (_) {}
    } else {
      updateAudioStatus();
    }
  },
  resolutionApplied(width, height, success) {
    if (!pendingResolution || width !== pendingResolution.width || height !== pendingResolution.height) return;
    clearTimeout(resolutionTimer);
    if (!success) { reloadResolution(activeResolution); return; }
    pendingResolution = null;
    displayStatus.textContent = `${width}×${height}`;
  },
  frameCount: 0,
  canvas: document.getElementById('canvas'),
  print(text) { console.log(text); document.getElementById('log').textContent += text + '\n'; },
  printErr: text => console.log(text),
  // Keep native form/selector keys out of SDL while the canvas is unfocused.
  preInit() { ENV.SDL_EMSCRIPTEN_KEYBOARD_ELEMENT = '#canvas'; },
  onAbort: reason => { if (pendingResolution) reloadResolution(activeResolution); else result({type: 'abort', reason: String(reason)}); },
  onExit: code => result({type: 'exit', code}),
  captureFrame(glErrors, colorClears) {
    ++Module.frameCount;
    if (Module.interactiveReady && !Module.resolutionReady &&
        (!Module.connect || Module.playerState?.netMode === 3)) {
      Module.resolutionReady = true;
      setTimeout(() => applyResolution(activeResolution), 0);
    }
    if (Module.interactive && Module.frameCount === 1) {
      Module.firstFrameMs = performance.now();
      document.getElementById('status').textContent = Module.splash ? 'Playing splash' : 'Playing ' + Module.map;
      setTimeout(updateAudioStatus, 0);
    }
    if (Module.interactive && !Module.captureRequested && Module.frameCount > 1) return;
    Module.captureRequested = false;
    const gl = Module.canvas.getContext('webgl');
    const width = gl.drawingBufferWidth, height = gl.drawingBufferHeight;
    const pixels = new Uint8Array(width * height * 4);
    gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    const webglError = gl.getError();
    const histogram = {};
    let rgbNonzero = 0, opaque = 0, sum = 0, maxChannel = 0;
    for (let i = 0; i < pixels.length; i += 4) {
      const color = Array.from(pixels.subarray(i, i + 4)).join(',');
      histogram[color] = (histogram[color] || 0) + 1;
      if (pixels[i] || pixels[i+1] || pixels[i+2]) ++rgbNonzero;
      sum += pixels[i] + pixels[i+1] + pixels[i+2];
      maxChannel = Math.max(maxChannel, pixels[i], pixels[i+1], pixels[i+2]);
      if (pixels[i+3] === 255) ++opaque;
    }
    window.frameEvidence = {renderer: 'OpenGLDrv through GL4ES', width, height, colorClears,
      contextAttributes: gl.getContextAttributes(),
      frames: Module.frameCount, elapsedMs: performance.now(), glErrors, webglError,
      webglErrors: (window.frameEvidence?.webglErrors || 0) + (webglError !== 0 ? 1 : 0),
      meanRGB: sum / (width * height * 3), maxChannel, rgbNonzero, opaque, uniqueColors: Object.keys(histogram).length,
      histogramTruncated: Object.keys(histogram).length > 32,
      histogram: Object.entries(histogram).sort((a,b) => b[1]-a[1]).slice(0, 32)};
    window.lastFramePNG = Module.canvas.toDataURL('image/png');
    console.log('WASM: engine frame ' + JSON.stringify(window.frameEvidence));
  },
  configFiles: {}
};
Module.canvas.addEventListener('click', () => Module.canvas.focus());
for (const type of ['pointerdown', 'keydown']) document.addEventListener(type, () => { unlockAudio(); }, true);
document.addEventListener('visibilitychange', () => {
  const ctx = Module.audioContext;
  if (!ctx) return;
  if (document.hidden) {
    if (ctx.state === 'running') Promise.resolve(ctx.suspend()).then(updateAudioStatus, updateAudioStatus);
  } else if (audioGestureSeen && ctx.state === 'suspended') {
    Promise.resolve(ctx.resume()).then(updateAudioStatus, updateAudioStatus);
  }
  updateAudioStatus();
});
// Verified against shipped System/User.ini: Tab=Type, F1=ShowScores, mouse buttons=Fire/AltFire.
const mobileConfig = {
  canvas: Module.canvas, pointerEvents: true,
  binds: {forward:'KeyW', back:'KeyS', left:'KeyA', right:'KeyD', fire:{mouse:0}, alt:{mouse:2},
    jump:'Space', crouch:'KeyC', use:'KeyE', next:{wheel:100}, prev:{wheel:-100}, score:'F1', escape:'Escape'},
  touch: {stick:true, look:true, menuMode:true, sensitivity:1, acceleration:false, buttons:[
    {id:'fire',label:'FIRE'}, {id:'alt',label:'ALT'}, {id:'jump',label:'JUMP'},
    {id:'crouch',label:'DUCK'}, {id:'use',label:'USE'}, {id:'next',label:'W+'},
    {id:'prev',label:'W−'}, {id:'score',label:'SCORE'}, {id:'escape',label:'ESC'}]},
  gamepad: {deadzone:.15, sensitivity:600, buttons:{0:'jump',1:'crouch',2:'use',3:'next',
    4:'prev',5:'next',6:'alt',7:'fire',8:'score',9:'escape',10:'use',11:'crouch'}},
  qos: {fullscreen:options.get('fullscreen') === '1', orientation:'landscape', keepAwake:true,
    audioUnlock:() => unlockAudio()}
};
window.mobileInput = MobileInput.attach(mobileConfig);
if (window.mobileInput.enabled) {
  document.getElementById('input-help').textContent = 'Stick moves; drag right side to look. MENU / POINTER enables menu taps. ESC closes menus; FIRE spawns. Tap Fullscreen for a larger play area.';
}

(async () => {
  document.getElementById('status').textContent = 'Fetching asset manifest…';
  const response = await fetch('file-sizes.json');
  if (!response.ok) throw Error('manifest HTTP ' + response.status);
  Module.fileSizes = await response.json();
  const maps = Object.keys(Module.fileSizes).filter(path => /^Maps\/[^/]+\.ut2$/i.test(path))
    .map(path => path.slice(5, -4)).sort((a, b) => a.localeCompare(b));
  const picker = document.getElementById('map');
  const groups = new Map();
  for (const map of maps) {
    const prefix = map.includes('-') ? map.split('-')[0] : 'Other';
    if (!groups.has(prefix)) {
      const group = document.createElement('optgroup');
      group.label = prefix;
      picker.appendChild(group);
      groups.set(prefix, group);
    }
    groups.get(prefix).appendChild(new Option(map, map));
  }
  let savedMap;
  try { savedMap = localStorage.getItem('ut2004-map'); } catch (_) {}
  const requestedMap = options.get('map');
  if (requestedMap && !maps.includes(requestedMap)) throw Error('Unknown map: ' + requestedMap);
  picker.value = [requestedMap, savedMap, 'DM-Rankin'].find(map => maps.includes(map));
  Module.map = Module.connect ? 'DM-Rankin' : picker.value;
  Module.localMap = !Module.connect && !!requestedMap;
  const requestedGame = options.get('game');
  if (requestedGame && !/^[A-Za-z_]\w*\.[A-Za-z_]\w*$/.test(requestedGame)) throw Error('Invalid game class: ' + requestedGame);
  Module.gameClass = Module.localMap ? requestedGame : null;
  if (requestedMap) { try { localStorage.setItem('ut2004-map', requestedMap); } catch (_) {} }
  picker.disabled = false;
  const playMap = document.getElementById('play-map');
  playMap.disabled = false;
  playMap.onclick = () => {
    try { localStorage.setItem('ut2004-map', picker.value); } catch (_) {}
    const url = new URL(location.href);
    for (const key of ['connect', 'bounded', 'splash']) url.searchParams.delete(key);
    url.searchParams.set('interactive', '1');
    url.searchParams.set('map', picker.value);
    location.assign(url);
  };
  document.getElementById('status').textContent = 'Loading config files…';
  await Promise.all(Object.keys(Module.fileSizes).filter(p => /\.(ini|int)$/i.test(p)).map(async path => {
    const response = await fetch(Module.dataBaseURL + path.split('/').map(encodeURIComponent).join('/'));
    if (!response.ok) throw Error(path + ' HTTP ' + response.status);
    let bytes = new Uint8Array(await response.arrayBuffer());
    if (/\.ini$/i.test(path)) {
      // Engine class defaults reload viewport settings from INI during initialization.
      const text = new TextDecoder().decode(bytes).replace(/^WindowedViewport([XY])=\d+/gm,
        (_, axis) => 'WindowedViewport' + axis + '=' + (axis === 'X' ? canvas.width : canvas.height));
      bytes = new TextEncoder().encode(text);
    }
    Module.configFiles[path] = bytes;
  }));
  document.getElementById('status').textContent = 'Starting engine (first load downloads a ~22 MB engine; can take 1-2 minutes)…';
  const script = document.createElement('script');
  script.onerror = () => result({type: 'error', message: 'Failed to load ut2004.js'});
  script.src = 'ut2004.js';
  document.body.appendChild(script);
})().catch(error => result({type: 'error', message: String(error)}));
</script>
